name: astral-patch

services:
  astral-patch-site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${ASTRAL_APP_PORT:-3001}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD is required}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:?NUXT_OAUTH_GOOGLE_CLIENT_ID is required}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:?NUXT_OAUTH_GOOGLE_CLIENT_SECRET is required}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://factchat-cloud.mindlogic.ai/v1/gateway}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      postgres-db:
        condition: service_healthy

  r2-backup:
    build:
      context: .
      dockerfile: Dockerfile.r2-backup
    environment:
      R2_BACKUP_ACCOUNT_ID: ${R2_BACKUP_ACCOUNT_ID:-}
      R2_BACKUP_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID:-}
      R2_BACKUP_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET_NAME: ${R2_BACKUP_BUCKET_NAME:-}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX:-postgres}
      R2_BACKUP_ENDPOINT: ${R2_BACKUP_ENDPOINT:-}
    profiles:
      - backup
    volumes:
      - ${ASTRAL_BACKUP_DIR:-/var/backups/astral-patch}:/backup:ro

  postgres-db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${ASTRAL_DB_HOST_PORT:-5433}:5432"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  db-migrate:
    image: postgres:18-alpine
    profiles:
      - migration
    environment:
      PGHOST: postgres-db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./deploy/run-migrations.sh:/usr/local/bin/run-migrations:ro
      - ./database/migrations:/migrations:ro
    entrypoint: ["sh", "/usr/local/bin/run-migrations"]
    command: ["run"]
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
    name: astral-patch_pgdata
