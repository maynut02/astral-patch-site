name: astral-patch

services:
  astral-patch-site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${ASTRAL_APP_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${ASTRAL_DB_HOST_PORT:-5433}:5432"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  db-migrate:
    image: postgres:17-alpine
    profiles:
      - migration
    environment:
      PGHOST: postgres-db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./deploy/run-migrations.sh:/usr/local/bin/run-migrations:ro
      - ${ASTRAL_PATCH_REPO_DIR:-../astral-party-korean-patch}/database/migrations:/migrations:ro
    entrypoint: ["sh", "/usr/local/bin/run-migrations"]
    command: ["run"]
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
    name: astral-patch_pgdata
