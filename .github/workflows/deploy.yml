name: Deploy production

on:
  pull_request:
    branches:
      - release
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astral-patch-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -Eeuo pipefail

            SITE_DIR='${{ secrets.SERVER_WORK_DIR }}'
            DEPLOY_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || '' }}'

            cd "$SITE_DIR"
            CURRENT_SHA="$(git rev-parse HEAD)"
            git fetch origin release
            RELEASE_SHA="$(git rev-parse origin/release)"
            DEPLOY_SHA="${DEPLOY_SHA:-$RELEASE_SHA}"

            if [ "$DEPLOY_SHA" != "$RELEASE_SHA" ]; then
              if git merge-base --is-ancestor "$DEPLOY_SHA" "$RELEASE_SHA"; then
                echo "Skipping outdated deployment $DEPLOY_SHA; release is already at $RELEASE_SHA"
                exit 0
              fi

              echo "Deployment target $DEPLOY_SHA is not part of origin/release" >&2
              exit 1
            fi

            if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ] && git merge-base --is-ancestor "$DEPLOY_SHA" "$CURRENT_SHA"; then
              echo "Skipping outdated deployment $DEPLOY_SHA; server already has newer $CURRENT_SHA"
              exit 0
            fi

            git reset --hard
            git checkout -B release "$DEPLOY_SHA"
            git branch --set-upstream-to=origin/release release >/dev/null 2>&1 || true
            docker compose -p astral-patch up -d postgres-db

            # 저장소의 백업 서비스 정의를 서버와 동기화한다.
            sudo -n install -m 0755 deploy/backup-db.sh /usr/local/sbin/astral-patch-backup-db
            sudo -n install -m 0644 deploy/systemd/astral-patch-db-backup.service /etc/systemd/system/astral-patch-db-backup.service
            sudo -n install -m 0644 deploy/systemd/astral-patch-db-backup.timer /etc/systemd/system/astral-patch-db-backup.timer

            if ! sudo -n test -f /etc/default/astral-patch; then
              defaults_file="$(mktemp)"
              {
                printf 'ASTRAL_APP_DIR=%s\n' "$SITE_DIR"
                printf 'ASTRAL_COMPOSE_PROJECT=astral-patch\n'
                printf 'ASTRAL_BACKUP_DIR=/var/backups/astral-patch\n'
                printf 'ASTRAL_BACKUP_RETENTION_DAYS=14\n'
                printf 'ASTRAL_R2_BACKUP_ENABLED=false\n'
              } > "$defaults_file"
              sudo -n install -m 0644 "$defaults_file" /etc/default/astral-patch
              rm -f "$defaults_file"
            fi

            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now astral-patch-db-backup.timer

            # 업로더 변경사항을 포함하도록 백업 이미지를 다시 빌드한다.
            docker compose -p astral-patch --profile backup build r2-backup

            # 마이그레이션 전에 현재 DB를 백업하고 서버 백업 설정을 함께 적용한다.
            sudo -n systemctl start astral-patch-db-backup.service

            docker compose -p astral-patch --profile migration run --rm db-migrate
            docker compose -p astral-patch up -d --build --remove-orphans astral-patch-site

            APP_PORT="$(sed -n 's/^ASTRAL_APP_PORT=//p' .env | tail -1 | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            APP_PORT="${APP_PORT:-3001}"

            # WebSocket 프록시를 포함한 Nginx 설정을 저장소 템플릿과 동기화한다(포트 검증 포함).
            NGINX_CONFIG="$(mktemp)"
            sh deploy/render-nginx-config.sh deploy/nginx/astral-patch-site.conf.template astral.maynutlab.com "$APP_PORT" > "$NGINX_CONFIG"
            sudo -n install -m 0644 "$NGINX_CONFIG" /etc/nginx/conf.d/astral-patch-site.conf
            rm -f "$NGINX_CONFIG"
            sudo -n nginx -t
            sudo -n systemctl reload nginx

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:${APP_PORT}/" >/dev/null; then
                echo "Astral Patch site is healthy on 127.0.0.1:${APP_PORT}"
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                docker compose -p astral-patch logs --tail=150 astral-patch-site
                exit 1
              fi
              sleep 2
            done

            docker compose -p astral-patch ps
