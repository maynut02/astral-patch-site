name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - release
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: astral_patch_ci
      POSTGRES_USER: astral_patch
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgresql://astral_patch:ci-password@postgres-db:5432/astral_patch_ci
      NUXT_SESSION_PASSWORD: ci-session-password-with-at-least-32-characters
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ci-client-id
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ci-client-secret
      ASTRAL_DB_HOST_PORT: "55434"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration files
        run: pnpm run db:check

      - name: Apply migrations twice
        run: |
          docker compose -p astral-patch-ci up -d --wait postgres-db
          docker compose -p astral-patch-ci --profile migration run --rm db-migrate
          docker compose -p astral-patch-ci --profile migration run --rm db-migrate

      - name: Lint
        run: pnpm run lint

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgresql://astral_patch:ci-password@127.0.0.1:55434/astral_patch_ci
        run: pnpm run test:unit

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          pnpm run test:security
          pnpm config set fetch-retries 0
          pnpm config set fetch-timeout 30000
          pnpm run audit:prod

      - name: Build production image
        run: docker build --tag astral-patch-site:ci .

      - name: Smoke test production image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name astral-patch-site-ci --network astral-patch-ci_default \
            -p 127.0.0.1:55435:3000 \
            -e DATABASE_URL -e NUXT_SESSION_PASSWORD \
            -e NUXT_OAUTH_GOOGLE_CLIENT_ID -e NUXT_OAUTH_GOOGLE_CLIENT_SECRET \
            astral-patch-site:ci
          ASTRAL_SMOKE_BASE_URL=http://127.0.0.1:55435 pnpm run smoke:release
          docker image inspect astral-patch-site:ci --format '{{.Id}}' > .data/production-image-id.txt

      - name: Package reviewed deployment
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=.data/astral-site-source.tar.gz HEAD
          docker save astral-patch-site:ci | gzip -1 > .data/astral-site-image.tar.gz
          sha256sum .data/astral-site-source.tar.gz .data/astral-site-image.tar.gz \
            database/migrations/0019_editor_glossary.sql database/migrations/0020_base_glossary.sql > .data/SHA256SUMS

      - name: Upload deployment package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astral-site-${{ github.sha }}
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .data/astral-site-source.tar.gz
            .data/astral-site-image.tar.gz
            .data/production-image-id.txt
            .data/release-smoke.json
            .data/SHA256SUMS
            database/migrations/0019_editor_glossary.sql
            database/migrations/0020_base_glossary.sql
            docs/glossary-release.md

      - name: Stop migration database
        if: always()
        shell: bash
        run: |
          docker logs --tail=100 astral-patch-site-ci 2>/dev/null || true
          docker rm -f astral-patch-site-ci 2>/dev/null || true
          docker compose -p astral-patch-ci down --volumes
