name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - release
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: astral_patch_ci
      POSTGRES_USER: astral_patch
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgresql://astral_patch:ci-password@postgres-db:5432/astral_patch_ci
      NUXT_SESSION_PASSWORD: ci-session-password-with-at-least-32-characters
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ci-client-id
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ci-client-secret
      ASTRAL_DB_HOST_PORT: "55434"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration files
        run: pnpm run db:check

      - name: Apply migrations twice
        run: |
          docker compose -p astral-patch-ci up -d --wait postgres-db
          docker compose -p astral-patch-ci --profile migration run --rm db-migrate
          docker compose -p astral-patch-ci --profile migration run --rm db-migrate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Stop migration database
        if: always()
        run: docker compose -p astral-patch-ci down --volumes
