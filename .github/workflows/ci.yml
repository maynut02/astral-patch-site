name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - release
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: astral_patch_ci
      POSTGRES_USER: astral_patch
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgresql://astral_patch:ci-password@postgres-db:5432/astral_patch_ci
      NUXT_SESSION_PASSWORD: ci-session-password-with-at-least-32-characters
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ci-client-id
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ci-client-secret
      ASTRAL_DB_HOST_PORT: "55434"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration files
        run: pnpm run db:check

      - name: Apply migrations twice
        run: |
          docker compose -p astral-patch-ci up -d --wait postgres-db
          docker compose -p astral-patch-ci --profile migration run --rm db-migrate
          docker compose -p astral-patch-ci --profile migration run --rm db-migrate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          pnpm config set fetch-retries 0
          pnpm config set fetch-timeout 30000

          for attempt in 1 2; do
            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            set +e
            timeout 60s pnpm audit --prod --audit-level high --json >"$stdout_file" 2>"$stderr_file"
            audit_exit=$?
            set -e

            cat "$stdout_file"
            cat "$stderr_file" >&2

            audit_result="$(node - "$stdout_file" <<'NODE'
          const fs = require('node:fs')

          const file = process.argv[2]
          let high = 0
          let critical = 0
          let timeoutError = false

          try {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            high = Number(report?.metadata?.vulnerabilities?.high ?? 0)
            critical = Number(report?.metadata?.vulnerabilities?.critical ?? 0)

            if (high === 0 && critical === 0 && report?.advisories) {
              for (const advisory of Object.values(report.advisories)) {
                if (advisory?.severity === 'high') high += 1
                if (advisory?.severity === 'critical') critical += 1
              }
            }

            const errorCode = Number(report?.error?.code ?? NaN)
            const errorMessage = String(report?.error?.message ?? '')
            timeoutError = errorCode === 23 || /timeout|timed out|operation was aborted/i.test(errorMessage)
          } catch {
            // JSON 보고서가 없는 네트워크 오류는 stderr 검사에서 판별한다.
          }

          process.stdout.write(`${high} ${critical} ${timeoutError ? 1 : 0}`)
          NODE
            )"
            read -r high_count critical_count json_timeout <<<"$audit_result"

            if (( high_count > 0 || critical_count > 0 )); then
              echo "High/critical vulnerabilities found: high=${high_count}, critical=${critical_count}" >&2
              rm -f "$stdout_file" "$stderr_file"
              exit 1
            fi

            if [ "$audit_exit" -eq 0 ]; then
              rm -f "$stdout_file" "$stderr_file"
              exit 0
            fi

            if [ "$audit_exit" -eq 124 ] || [ "$json_timeout" -eq 1 ] \
              || grep -Eqi 'timeout|timed out|operation was aborted due to timeout|error \(23\)' "$stdout_file" "$stderr_file"; then
              rm -f "$stdout_file" "$stderr_file"

              if [ "$attempt" -eq 2 ]; then
                echo "::warning::pnpm audit could not reach the npm security advisory API because of a network timeout. High/critical vulnerability status could not be verified in this run."
                exit 0
              fi

              sleep 10
              continue
            fi

            echo "pnpm audit failed for a non-timeout reason (exit code ${audit_exit})." >&2
            rm -f "$stdout_file" "$stderr_file"
            exit "$audit_exit"
          done

      - name: Stop migration database
        if: always()
        run: docker compose -p astral-patch-ci down --volumes
