allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

overrides:
  'fontless>esbuild': 0.28.2
  '@tiptap/core': 3.31.3
  'brace-expansion@>=2.0.0 <2.1.6': 2.1.6
  'prosemirror-view@<1.42.3': 1.42.3
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'vite@>=8.2.0 <8.2.4': 8.2.4
  'launch-editor@<2.14.2': 2.14.2
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'node-forge@>=1.0.0 <1.4.1': 1.4.1
  'seroval@>=1.0.0 <1.6.8': 1.6.8
  # DevTools 3 still imports the removed simple-git 3 default export.
  # Keep its import patch together with this security upgrade to simple-git 4.
  '@nuxt/devtools>simple-git': 4.0.2

patchedDependencies:
  '@nuxt/devtools@3.4.2': patches/@nuxt__devtools@3.4.2.patch
  'braces@3.0.3': patches/braces@3.0.3.patch

# braces has no fixed npm release; CI verifies its local patch before audit.
# Remove its exception and patch when a fixed release is available.
# See docs/dependency-security.md for sources and verification.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
